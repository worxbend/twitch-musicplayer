# ─────────────────────────────────────────────────────────────────────────────
# Run the station locally, building both images from the Dockerfiles in this
# repository.
#
#   docker compose up -d --build
#
# Frontend: http://localhost:3000        Admin: http://localhost:3000/admin
# Backend:  http://localhost:8080        Swagger: http://localhost:8080/swagger
#
# Copy .env.example to .env first if you want to point MUSIC_DIR at your own
# library or move the published ports.
# ─────────────────────────────────────────────────────────────────────────────

name: lofi-radio

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lofi-radio-backend:local
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Your music, mounted read-only: the service only ever reads it.
      - ${MUSIC_DIR:-./music}:/music:ro
      # Play history (Bloom filter) and the blocklist, so both survive a restart.
      - bloom-data:/data
    environment:
      PORT: "8080"
      MUSIC_DIR: /music
      BLOOM_PATH: /data/lofi-radio.bloom
      # Must be the address the *browser* uses, because stream URLs are built
      # from it and handed to the page.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Comma-separated frontend addresses, as the browser sees them, whose
      # pages may control the station. Pages from anywhere else are refused.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    # Writes go only to the /data volume. A custom obs.now_playing_file must
    # sit on a writable mounted path too.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 300s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time. Leave empty to resolve the backend at runtime
        # instead, from BACKEND_URL or from the host that served the page.
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_AUTO_START_AUDIO: ${VITE_AUTO_START_AUDIO:-false}
    image: lofi-radio-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Overrides the build-time value without rebuilding. Empty is fine.
      BACKEND_URL: ${BACKEND_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bloom-data:

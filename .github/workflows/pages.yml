name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/signal-observatory/*.png
      - frontend/src/assets/worxbend-logo.png
      - frontend/src/routes.ts
      - frontend/src/viz/scenes.ts
      - scripts/site.sh
      - .github/workflows/pages.yml
  # Pull requests build and check the site but never deploy it.
  pull_request:
    paths:
      - site/**
      - docs/signal-observatory/*.png
      - frontend/src/assets/worxbend-logo.png
      - frontend/src/routes.ts
      - frontend/src/viz/scenes.ts
      - scripts/site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# PR checks get their own group: a pending PR run must never replace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: install webp tools
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends webp
      # The site reuses the README screenshots and logo instead of keeping copies.
      - name: assemble site
        run: bash scripts/site.sh build _site
      # Fail on a missing local asset, an oversized site or a tuner route with no
      # frontend page before anything deploys.
      - name: check site
        run: bash scripts/site.sh check _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

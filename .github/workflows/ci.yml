name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push runs are keyed by commit: a group holds one pending run, so a shared group would drop a head's verdict.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain parity
        working-directory: .
        run: bash scripts/check-toolchains.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      # Local equivalent: make -C backend check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: go test
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: go build
        run: go build ./cmd/api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: typecheck
        run: npm run typecheck
      - name: npm test
        run: npm test
      - name: build
        run: npm run build
      - name: default config.js is shipped
        run: test -f dist/config.js

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: playwright
        run: npm run test:ui
        env:
          CI: true
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          mkdir -p bin
          tar -xJf "$tarball" --strip-components=1 -C bin "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Local equivalent: bash scripts/lint.sh
      - name: actionlint and shellcheck
        run: bash scripts/lint.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate compose files
        run: |
          set -euo pipefail
          for f in docker-compose.yml docker-compose.build.yml docker-compose.hub.yml; do
            docker compose -f "$f" config -q
          done
      - name: build backend image
        run: docker build -t lofi-backend:ci backend
      - name: build frontend image
        run: docker build -t lofi-frontend:ci frontend
      # Local equivalent: make docker-smoke
      - name: smoke images
        run: bash scripts/docker-smoke.sh lofi-backend:ci lofi-frontend:ci
      # Local equivalent: make docker-smoke
      - name: smoke compose hardening
        run: bash scripts/compose-smoke.sh lofi-backend:ci lofi-frontend:ci

  # Native arm64 runner, no QEMU: npm ci installs the arm64 musl optional deps
  # (TS7 native compiler) and the Go build targets arm64 for real.
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build backend image
        run: docker build -t lofi-backend:arm64 backend
      - name: build frontend image
        run: docker build -t lofi-frontend:arm64 frontend
      - name: check image architecture
        run: |
          set -euo pipefail
          for img in lofi-backend:arm64 lofi-frontend:arm64; do
            test "$(docker image inspect -f '{{.Architecture}}' "$img")" = arm64
          done
      # The smoke script runs node for its config.js check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: smoke images
        run: bash scripts/docker-smoke.sh lofi-backend:arm64 lofi-frontend:arm64

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      # Local equivalent: make -C backend check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: go build
        run: go build ./cmd/api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: npm test
        run: npm test
      - name: build
        run: npm run build

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: playwright
        run: npm run test:ui
        env:
          CI: true
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate compose files
        run: |
          set -euo pipefail
          for f in docker-compose.yml docker-compose.build.yml docker-compose.hub.yml; do
            docker compose -f "$f" config -q
          done
      - name: build backend image
        run: docker build -t lofi-backend:ci backend
      - name: build frontend image
        run: docker build -t lofi-frontend:ci frontend
      - name: smoke backend
        run: |
          set -euo pipefail
          docker run -d --name be -p 8080:8080 -e BASE_URL=http://127.0.0.1:8080 --tmpfs /music lofi-backend:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health
          test "$(docker exec be id -u)" = 10001
          # The Bloom autosave target must be writable by the non-root user.
          docker exec be touch /data/probe
      - name: smoke frontend
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          docker run -d --name fe -p 3000:80 -e BACKEND_URL=https://radio.example lofi-frontend:ci
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ > index.html
          curl -fsS -D headers.txt http://127.0.0.1:3000/config.js > config.js
          grep -F 'backendUrl: "https://radio.example"' config.js
          grep -i '^cache-control:.*no-store' headers.txt
          curl -fsS http://127.0.0.1:3000/admin > admin.html
          grep -F '/assets/admin-' admin.html
          if cmp -s index.html admin.html; then echo "/admin served the SPA index"; exit 1; fi
          curl -fsS -o /dev/null http://127.0.0.1:3000/now-playing
      - name: container logs
        if: failure()
        run: |
          docker logs be || true
          docker logs fe || true

openapi: "3.0.3"
info:
  title: Lofi Radio API
  version: "1.0.0"
  description: >
    Backend API for the Lofi Radio player. Handles song library, playback queue,
    player state, and audio streaming. Real-time updates are delivered via WebSocket at `/ws`.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: songs
    description: Music library
  - name: queue
    description: Playback queue management
  - name: player
    description: Player state

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: up
    head:
      summary: Health check (headers only)
      description: Same as GET without a body. Used by probes such as `wget --spider`.
      operationId: headHealth
      responses:
        "200":
          description: Service is healthy

  /v1/songs:
    get:
      summary: List songs
      description: Returns all indexed songs. Use `?q=` to filter by title, artist, album, or filename.
      operationId: listSongs
      tags: [songs]
      parameters:
        - name: q
          in: query
          description: Search query (matches title, artist, album, filename)
          required: false
          schema:
            type: string
            example: "lofi"
      responses:
        "200":
          description: Song list
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Song"
                  total:
                    type: integer

  /v1/songs/{id}:
    get:
      summary: Get song by ID
      operationId: getSong
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Song details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/songs/{id}/content:
    get:
      summary: Stream song audio
      description: Returns the raw MP3 file. Supports `Range` headers for seeking.
      operationId: streamSong
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
        - name: Range
          in: header
          schema:
            type: string
            example: "bytes=0-"
      responses:
        "200":
          description: Full audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (range response)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Range not satisfiable for the file size
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/songs/{id}:stream:
    get:
      summary: Stream song audio (alias)
      description: Alias of `/v1/songs/{id}/content`. Returns the raw MP3 file. Supports `Range` headers for seeking.
      operationId: streamSongAlias
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
        - name: Range
          in: header
          schema:
            type: string
            example: "bytes=0-"
      responses:
        "200":
          description: Full audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (range response)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Range not satisfiable for the file size
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/songs/{id}/cover:
    get:
      summary: Get embedded cover art
      description: >
        Returns the song's embedded ID3v2 (APIC) picture: the front cover when
        present, else the first other picture. The type is sniffed from the
        bytes; only JPEG, PNG, GIF and WebP are served. Tags over 8 MiB are not
        parsed and count as no picture.
      operationId: getSongCover
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Cover image bytes
          headers:
            ETag:
              schema:
                type: string
                example: '"9f86d081884c7d65"'
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Cover unchanged since the ETag in If-None-Match
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown song, missing file, or no usable embedded picture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/songs/{id}:block:
    post:
      summary: Don't play this song
      description: >
        Pulls the song out of rotation: auto-select never picks it, its queued
        entries are removed, and adding it to the queue or playing it next
        returns 409. The song playing now keeps playing. Blocked song IDs are
        saved next to the Bloom file, as `<bloom path without extension>.blocked.json`,
        so they survive a restart. Blocking a blocked song succeeds again.
        Broadcasts `queue_updated` with reason `song_blocked`.
      operationId: blockSong
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Song blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: song blocked
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The blocklist file could not be saved; the song stays unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/songs/{id}:unblock:
    post:
      summary: Allow a blocked song again
      description: >
        Puts the song back in rotation. A blocked ID whose file has left the
        library is removed too. Unblocking an indexed song that is not blocked
        succeeds. Broadcasts `queue_updated` with reason `song_unblocked`.
      operationId: unblockSong
      tags: [songs]
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Song unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: song unblocked
        "404":
          description: The ID is neither blocked nor in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The blocklist file could not be saved; the song stays blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/blocked:
    get:
      summary: List blocked songs
      description: >
        Returns the blocked songs, sorted by ID. A blocked song whose file has
        left the library is listed as `{"id": "...", "missing": true}`.
      operationId: listBlocked
      tags: [songs]
      responses:
        "200":
          description: Blocked songs
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Song"
                        - $ref: "#/components/schemas/MissingSong"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/queue:
    get:
      summary: List queue
      operationId: listQueue
      tags: [queue]
      responses:
        "200":
          description: Current playback queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueItem"
                  total:
                    type: integer
    post:
      summary: Add song to queue
      operationId: addToQueue
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [song_id]
              properties:
                song_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Queue item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SongBlocked"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/queue/{id}:
    delete:
      summary: Remove queue item
      operationId: removeFromQueue
      tags: [queue]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Queue item could not be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/queue/{id}:move:
    post:
      summary: Move queue item up or down
      description: >
        Shifts the item one place toward the front (`up`) or back (`down`).
        At either end of the queue the call is a no-op that returns
        `moved: false`. A real move broadcasts `queue_updated` with reason
        `song_moved`.
      operationId: moveQueueItem
      tags: [queue]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        "200":
          description: Item position after the move
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  position:
                    type: integer
                    description: 1-based position in the queue
                  moved:
                    type: boolean
                    description: False when the item was already at that end
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: Queue item could not be moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/queue:skip:
    post:
      summary: Skip current song
      description: >
        Broadcasts `skip_now` over WebSocket so every connected audio client
        interrupts the current track, then returns the first queued song still
        in the library (entries whose file was removed are skipped). The queue is not modified here; the client's `need_song` →
        `NextSong` flow dequeues that song when it asks for the next track.
      operationId: skipCurrent
      tags: [queue]
      responses:
        "200":
          description: Skip broadcast sent; `song` is the upcoming queued song (null when no queued entry is playable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  song:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Song"
        "409":
          description: >
            Nothing would play next: no playable queued entry under manual_only
            (`queue is empty`), or an auto strategy with an empty library
            (`no songs available`); nothing is broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Queue or library could not be read; nothing is broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/queue:clear:
    post:
      summary: Clear queue
      description: Removes all pending entries from the queue.
      operationId: clearQueue
      tags: [queue]
      responses:
        "200":
          description: Queue cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: queue cleared

  /v1/queue:play-next:
    post:
      summary: Play song immediately
      description: >
        Inserts the requested song at the front of the queue and broadcasts `skip_now`
        over WebSocket so connected audio clients interrupt their current track and
        start playing the requested song, then `queue_updated` with reason `play_next`.
      operationId: playNext
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [song_id]
              properties:
                song_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Song queued for immediate play
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: song queued for immediate play
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SongBlocked"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/player:
    get:
      summary: Get player state
      description: Returns current song, queue length, and total library size.
      operationId: getPlayerState
      tags: [player]
      responses:
        "200":
          description: Player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerState"

  /v1/player:skip:
    post:
      summary: Skip current track
      description: >
        Broadcasts `skip_now` over WebSocket to all connected audio clients
        (main scene, overlay) so they immediately abandon the current track and
        request the next one. No queue entry is consumed here — the natural
        `need_song` → `NextSong` flow handles dequeue when the client responds.
        It returns 409 and broadcasts nothing when nothing would play next (no
        playable queued entry under `manual_only`, or an auto strategy with an
        empty library), so a skip cannot leave the stream silent.
      operationId: skipPlayer
      tags: [player]
      responses:
        "200":
          description: Skip broadcast sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: skip broadcast
        "409":
          description: >
            Nothing would play next: no playable queued entry under manual_only
            (`queue is empty`), or an auto strategy with an empty library
            (`no songs available`); nothing is broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Queue or library could not be read; nothing is broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/now-playing.txt:
    get:
      summary: Get the current song as plain text
      description: >
        Returns the current song as one plain-text line for chat bots
        (Nightbot `$(urlfetch)`, StreamElements `${customapi}`). The line uses
        `obs.now_playing_format` (default `{artist} - {title}`); a song without
        an artist renders just its title, and control characters in tags become
        spaces.
        While nothing is playing the body is the `idle` text, or empty when
        `idle` is absent. There is no trailing newline, and the response is
        sent with `Cache-Control: no-store`.
      operationId: getNowPlayingText
      tags: [player]
      parameters:
        - name: idle
          in: query
          required: false
          description: >
            Fallback text, used only while nothing is playing. Control
            characters (including CR, LF, tab and Unicode line/paragraph
            separators) become spaces and surrounding whitespace is trimmed. It is validated on
            every request: over 200 characters returns 400 even while a song
            plays.
          schema:
            type: string
            maxLength: 200
            example: Radio is idle
      responses:
        "200":
          description: Current song line, or the idle text (empty without `idle`) when idle
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            text/plain:
              schema:
                type: string
                example: Nujabes - Aruarian Dance
        "400":
          description: idle is longer than 200 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/history:
    get:
      summary: List recent song starts
      description: >
        Returns the most recent song starts, newest first. History is kept in
        memory (last 50 starts) and resets when the server restarts.
      operationId: listHistory
      tags: [player]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entries to return. Values above 50 are clamped to 50.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Recent song starts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayEntry"
                  total:
                    type: integer
        "400":
          description: limit is not a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    songId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed JSON or a missing or invalid request field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds 4 KiB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SongBlocked:
      description: The song is blocked (`song is blocked`); see POST /v1/songs/{id}:unblock
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Song path resolves outside the music directory
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Server-side failure, such as a song file that cannot be read
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Song:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        duration_secs:
          type: number
          format: float
        size_bytes:
          type: integer
          format: int64
        has_cover:
          type: boolean
          description: True when GET /v1/songs/{id}/cover serves an embedded image.
        added_at:
          type: string
          format: date-time

    MissingSong:
      type: object
      description: A blocked song whose file has left the library.
      properties:
        id:
          type: string
          format: uuid
        missing:
          type: boolean
          enum: [true]

    QueueItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        song_id:
          type: string
          format: uuid
        song:
          $ref: "#/components/schemas/Song"
        position:
          type: integer
        source:
          type: string
          enum: [auto, manual]
        added_at:
          type: string
          format: date-time

    PlayerState:
      type: object
      properties:
        current_song:
          $ref: "#/components/schemas/Song"
          nullable: true
        queue_length:
          type: integer
        total_songs:
          type: integer
          description: Indexed songs in rotation. Blocked songs are not counted. Same value as the websocket state frame.
        next_song:
          $ref: "#/components/schemas/Song"
          description: First playable queued song. Omitted when nothing playable is queued or the queue cannot be read.

    PlayEntry:
      type: object
      properties:
        song:
          $ref: "#/components/schemas/Song"
        started_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
